name: rfdetr
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=2.1,<3
      - opencv-python-headless>=4.10,<5
      - torch==2.8.0
      - torchvision==0.23.0
      - rfdetr[train]==1.9.4
# The train extra supplies RF-DETR's supported training dependencies.
# Optional CUDA wheels: see README.md. No torchaudio is used by this project.
